# PerfFloat Monitor v6 配置
# 修改后运行 better.vbs restart 生效。

# 主题：frost | snow | mist | light | midnight | graphite | aurora | custom
theme=frost

# 布局：gamebar | grid | strip | mini | details
defaultLayout=gamebar

# 屏幕约束与八向吸附
snapToEdge=true
clampDuringDrag=true
snapMargin=6
snapThreshold=27

# 窗口
width=220
height=130
left=48
top=48
opacity=85
rememberPosition=true
fontName=Segoe UI

# 数据采集
refreshMs=1200
drives=C:
showNetwork=true
showSystem=true
showDiskIo=true

# 告警阈值
cpuWarn=70
cpuCrit=90
memWarn=75
memCrit=90
diskWarn=80
diskCrit=92

# theme=custom 时使用以下颜色
bgColor=#FFFFFF
panelColor=#F8FBFF
cardAltColor=#EDF4FA
textColor=#182437
mutedColor=#66758A
accentColor=#5278E5
cyanColor=#189DB5
goodColor=#259B72
warnColor=#C78124
dangerColor=#D94C62
gridColor=#CBD8E5
clickThrough=false
backgroundImageOpacity=100
backgroundImageMode=fill
backgroundImage=C:\Users\31626\Pictures\Camera Roll\airui.png
